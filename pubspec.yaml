name: todo_lo_que_dios_dijo
description: "Todo lo que Dios Dijo: todas las palabras que Yavé pronunció en la Biblia, con contexto, explicación, aplicación y oración."
publish_to: 'none'

# versionName+versionCode para Google Play. Incrementa el número tras "+" en cada subida.
version: 3.0.0+3

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  shared_preferences: ^2.5.5
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_analytics: ^12.6.0
  firebase_crashlytics: ^5.4.0
  flutter_localizations:
    sdk: flutter
  firebase_ai: ^4.0.0
  firebase_app_check: ^0.4.8
  flutter_tts: ^4.2.5
  wakelock_plus: ^1.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/

  fonts:
    # Títulos y citas: serif clásica, reverente.
    - family: Cormorant
      fonts:
        - asset: assets/fonts/CormorantGaramond-Medium.ttf
          weight: 500
        - asset: assets/fonts/CormorantGaramond-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/CormorantGaramond-SemiBold.ttf
          weight: 600
    # Texto de lectura e interfaz: sans moderna, muy legible.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
