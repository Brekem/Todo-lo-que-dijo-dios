name: Android

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # para publicar el APK como Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Formato
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Análisis estático
        run: flutter analyze

      - name: Tests
        run: flutter test

      # Firma de release opcional: define los secretos ANDROID_KEYSTORE_BASE64,
      # ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS y ANDROID_KEY_PASSWORD.
      - name: Preparar firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<PROPS
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          PROPS

      # Configuración de Firebase opcional (secreto FIREBASE_OPTIONS_DART con el
      # contenido de lib/firebase_options.dart generado por flutterfire).
      - name: Configurar Firebase
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
        if: env.FIREBASE_OPTIONS_DART != ''
        run: echo "$FIREBASE_OPTIONS_DART" > lib/firebase_options.dart

      - name: APK
        run: flutter build apk --flavor yave --release --obfuscate --split-debug-info=build/symbols

      # Edición «Jehová»: solo el Antiguo Testamento, en azul y blanco.
      # Es otra app (com.brekem.todoloquediosdijo.jehova).
      - name: APK edición Jehová
        run: flutter build apk --flavor jehova --release --obfuscate --split-debug-info=build/symbols-jehova

      # Edición «Jesús»: todas las palabras de Jesús, en rojo y blanco.
      # Es otra app (com.brekem.todoloquediosdijo.jesus).
      - name: APK edición Jesús
        run: flutter build apk --flavor jesus --release --obfuscate --split-debug-info=build/symbols-jesus

      - name: App Bundle (Google Play)
        run: flutter build appbundle --flavor yave --release --obfuscate --split-debug-info=build/symbols

      - name: Nombrar APK y leer versión
        id: version
        run: |
          cp build/app/outputs/flutter-apk/app-yave-release.apk Todo-lo-que-Dios-Dijo.apk
          cp build/app/outputs/flutter-apk/app-jehova-release.apk Todo-lo-que-Jehova-Dijo.apk
          cp build/app/outputs/flutter-apk/app-jesus-release.apk Todo-lo-que-Jesus-Dijo.apk
          # "2.0.0+2" → "2.0.0"; "3.0.0-dev.1+3" → "3.0.0-dev.1"
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          echo "name=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then echo "pre=true" >> "$GITHUB_OUTPUT"; else echo "pre=false" >> "$GITHUB_OUTPUT"; fi

      # APK descargable desde el móvil (pestaña Releases). Una release por
      # versión del pubspec: las versiones con guion (3.0.0-dev.1) salen como
      # prerelease y no reemplazan a la versión estable.
      - name: Publicar APK en Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}
          name: Todo lo que Dios Dijo ${{ steps.version.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.version.outputs.pre }}
          make_latest: ${{ steps.version.outputs.pre == 'false' }}
          overwrite_files: true
          body: |
            APK para instalar directamente en Android.
            Descarga **Todo-lo-que-Dios-Dijo.apk**, ábrelo y permite
            «Instalar apps de origen desconocido» si el teléfono lo pide.

            **Todo-lo-que-Jehova-Dijo.apk** es la edición «Jehová»: solo el
            Antiguo Testamento, en azul y blanco. Es otra app: se puede
            instalar junto a la otra.

            **Todo-lo-que-Jesus-Dijo.apk** es la edición «Jesús»: todas las
            palabras de Jesús, de Mateo a Apocalipsis, en rojo y blanco.
            También es otra app.
          files: |
            Todo-lo-que-Dios-Dijo.apk
            Todo-lo-que-Jehova-Dijo.apk
            Todo-lo-que-Jesus-Dijo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: todo-lo-que-dios-dijo-apk
          path: |
            build/app/outputs/flutter-apk/app-yave-release.apk
            build/app/outputs/flutter-apk/app-jehova-release.apk
            build/app/outputs/flutter-apk/app-jesus-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: todo-lo-que-dios-dijo-aab
          path: |
            build/app/outputs/bundle/yaveRelease/app-yave-release.aab
            build/symbols
